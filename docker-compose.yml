services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      VISUAL_SEARCH_API_KEY: ${VISUAL_SEARCH_API_KEY:?Set VISUAL_SEARCH_API_KEY in .env}
      VISUAL_SEARCH_DB: /data/visual_search.sqlite3
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-12582912}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
    volumes:
      - visual-search-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      VISUAL_SEARCH_API_URL: http://api:8000
      VISUAL_SEARCH_API_KEY: ${VISUAL_SEARCH_API_KEY:?Set VISUAL_SEARCH_API_KEY in .env}
    depends_on:
      - api
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  visual-search-data:
